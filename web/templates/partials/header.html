{{ define "header" }}
<header class="app-header">
    <div class="logo-area">
        <h1>⚡ Morphic</h1>
    </div>
    <nav class="tab-bar">
        <button class="tab-btn active" data-tab="converter" onclick="switchTab('converter')">
            <span class="tab-icon">🔄</span> Converter
        </button>
        <button class="tab-btn" data-tab="dupfinder" onclick="switchTab('dupfinder')">
            <span class="tab-icon">🔍</span> Dupfinder
        </button>
        <button class="tab-btn" data-tab="organizer" onclick="switchTab('organizer')">
            <span class="tab-icon">📂</span> Organizer
        </button>
        <button class="tab-btn" data-tab="trash" onclick="switchTab('trash')">
            <span class="tab-icon">🗑️</span> Safe Trash
        </button>
        <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')">
            <span class="tab-icon">⚙️</span> Watchers &amp; Config
        </button>
    </nav>
    <div class="header-status">
        <span class="status-indicator online" id="sseIndicator" title="Real-time live streaming connected">● Live</span>
    </div>
</header>
{{ end }}
