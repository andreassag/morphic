{{ define "history_tab" }}
<div class="tab-content" id="tab-history">
<div class="container">

    <div class="card">
        <div class="card-header-flex">
            <div class="card-title"><span class="icon">📜</span> Audit History</div>
            <div class="toolbar-actions">
                <select id="historyFilterOp" onchange="loadAuditHistory()">
                    <option value="">All Operations</option>
                    <option value="convert">Conversions</option>
                    <option value="delete">Safe-Trash Deletions</option>
                    <option value="sort">Organize / Sort</option>
                    <option value="rename">Renames</option>
                    <option value="restore">Restorations</option>
                    <option value="purge">Trash Purges</option>
                </select>
                <button class="btn btn-ghost btn-sm" onclick="loadAuditHistory()">🔄 Refresh</button>
            </div>
        </div>
        <p style="font-size:13px;color:var(--text-dim);margin-top:6px;">
            High-level audit log of bulk operations: media conversions, safe-trash deletions, date sorting, batch renames, and restorations.
        </p>
    </div>

    <!-- History Table -->
    <div class="card">
        <div class="table-responsive" style="max-height:650px;overflow:auto;">
            <table class="data-table" id="historyTable">
                <thead>
                    <tr>
                        <th style="width:160px;">Time</th>
                        <th style="width:110px;">Operation</th>
                        <th style="width:110px;">Source</th>
                        <th>Summary</th>
                        <th style="width:90px;">Files</th>
                        <th style="width:140px;">Size / Impact</th>
                        <th style="width:100px;">Status</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <tr>
                        <td colspan="7" style="text-align:center;padding:24px;color:var(--text-dim);">Loading audit history…</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="pagination-controls" id="historyPagination"></div>
    </div>

</div>
</div>
{{ end }}
