{{ define "trash_tab" }}
<div class="tab-content" id="tab-trash">
<div class="container">

    <div class="card">
        <div class="card-header-flex">
            <div class="card-title"><span class="icon">🗑️</span> Safe Trash</div>
            <div class="toolbar-actions">
                <button class="btn btn-ghost btn-sm" onclick="loadTrashHistory()">🔄 Refresh</button>
                <button class="btn btn-danger btn-sm" onclick="purgeExpiredTrash()">🧹 Purge Expired (&gt;30d)</button>
            </div>
        </div>
        <p style="font-size:13px;color:var(--text-dim);margin-top:6px;">
            Deleted files are moved to safe-trash rather than permanently destroyed. You can preview and restore any deleted item with 1-click.
        </p>
    </div>

    <!-- Trash Table -->
    <div class="card">
        <div class="table-responsive" style="max-height:650px;overflow:auto;">
            <table class="data-table" id="trashTable">
                <thead>
                    <tr>
                        <th style="width:60px;">Preview</th>
                        <th>Deleted At</th>
                        <th>Source</th>
                        <th>Original Path</th>
                        <th>Size</th>
                        <th>Status</th>
                        <th style="text-align:right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="trashTableBody">
                    <tr>
                        <td colspan="7" style="text-align:center;padding:24px;color:var(--text-dim);">Loading safe trash…</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="pagination-controls" id="trashPagination"></div>
    </div>

</div>
</div>
{{ end }}
