{{ define "lightbox_modal" }}
<div class="lightbox-overlay" id="lightboxOverlay" role="dialog" aria-modal="true" aria-label="Media Lightbox" tabindex="-1">
    <div class="lightbox-header">
        <div class="lightbox-title-area">
            <span class="lightbox-counter" id="lbCounter">1 / 1</span>
            <span class="lightbox-filename" id="lbFilename" title="">filename.jpg</span>
            <span class="mono-text" id="lbSize">0 KB</span>
        </div>
        <div class="lightbox-controls">
            <button class="lightbox-btn" id="lbZoomOut" onclick="lightboxZoom(-0.25)" aria-label="Zoom out" title="Zoom out (-)">🔍 -</button>
            <button class="lightbox-btn" id="lbZoomReset" onclick="lightboxZoomReset()" aria-label="Reset zoom" title="Reset zoom (0)">100%</button>
            <button class="lightbox-btn" id="lbZoomIn" onclick="lightboxZoom(0.25)" aria-label="Zoom in" title="Zoom in (+)">🔍 +</button>
            <a class="lightbox-btn" id="lbDownload" href="#" download aria-label="Download media" title="Download">⬇️</a>
            <button class="lightbox-btn" onclick="closeLightbox()" aria-label="Close lightbox (Esc)" title="Close (Esc)">✕</button>
        </div>
    </div>

    <div class="lightbox-body" id="lbBody">
        <button class="lightbox-nav-btn lightbox-prev" id="lbPrev" onclick="prevLightboxItem()" aria-label="Previous media (Left Arrow)">‹</button>
        <div id="lbMediaContainer" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;">
            <!-- Dynamic img or video inserted here -->
        </div>
        <button class="lightbox-nav-btn lightbox-next" id="lbNext" onclick="nextLightboxItem()" aria-label="Next media (Right Arrow)">›</button>
    </div>

    <div class="lightbox-footer">
        <div class="mono-text" id="lbPath">/path/to/media</div>
        <div id="lbDimensions" style="color:var(--text-dim);font-size:12px;"></div>
    </div>
</div>
{{ end }}
